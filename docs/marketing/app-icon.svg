<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="1024" height="1024">
  <!-- Source of the app icon (feedback 20.11.): detective hat over a magnifier with fork, knife and a bolt.
       Same shapes as androidApp/src/main/res/drawable/ic_launcher_foreground.xml.
       108 x 108 = adaptive icon canvas; the motif lies in the safe circle around (54, 54). -->
  <rect width="108" height="108" fill="#F7F3E8"/>
  <g transform="translate(54 56) scale(1.1) translate(-54 -56)">
    <!-- lens -->
    <path d="M36,58 a15,15 0 1,0 30,0 a15,15 0 1,0 -30,0 Z" fill="#FFFDF8" stroke="#2F5D4A" stroke-width="4"/>
    <!-- handle -->
    <path d="M62.2,69.2 L70.5,77.5" stroke="#2F5D4A" stroke-width="7" stroke-linecap="round" fill="none"/>
    <!-- fork -->
    <path d="M43.4,50 V54.6 M45.4,50 V54.6 M47.4,50 V54.6 M43.4,54.6 Q43.4,57.6 45.4,57.6 Q47.4,57.6 47.4,54.6 M45.4,57.6 V66.5"
          stroke="#2F5D4A" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- knife -->
    <path d="M50.2,49.8 C53,50.8 53.2,54.6 52.8,58 L50.2,58 Z" fill="#2F5D4A"/>
    <path d="M51.3,57.5 V66.5" stroke="#2F5D4A" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- bolt -->
    <path d="M59.4,50 L53.8,59.4 L57.2,59.4 L55,67.6 L61.8,56 L58.4,56 L60.8,50 Z" fill="#E0603F"/>
    <!-- hat: crown, band, brim -->
    <path d="M38.5,41 L40.6,30.2 Q42.4,26.4 47,27.2 L51,28.8 L55,27.2 Q59.6,26.4 61.4,30.2 L63.5,41 Z" fill="#2F5D4A"/>
    <path d="M39.3,36.6 H62.7 L63.4,40.2 H38.6 Z" fill="#A8CBB4"/>
    <path d="M29,41.6 a22,3 0 1,0 44,0 a22,3 0 1,0 -44,0 Z" fill="#2F5D4A"/>
  </g>
</svg>
